name: TrueVoice CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-audio-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler
          # gRPC might need to be built from source or installed via a PPA in a real setup.
          # Here we assume a simplified installation for demonstration.
          sudo apt-get install -y libgrpc++-dev protobuf-compiler-grpc
      - name: Configure CMake
        run: cmake -B services/audio-capture/build -S services/audio-capture
      - name: Build
        run: cmake --build services/audio-capture/build
      - name: Run Tests
        run: ctest --test-dir services/audio-capture/build --output-on-failure

  test-python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inference-stt, ai-agent]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/${{ matrix.service }}/uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "services/${{ matrix.service }}/.python-version"
      - name: Install dependencies
        run: cd services/${{ matrix.service }} && uv sync --dev
      - name: Run Pytest
        run: cd services/${{ matrix.service }} && uv run pytest tests/

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'
      - name: Install JS dependencies
        run: cd apps/dashboard && npm ci
      - name: Run Frontend Tests
        run: cd apps/dashboard && npm run test -- --run
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Backend Tests
        run: cd apps/dashboard/src-tauri && cargo test
